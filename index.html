<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_DECRYPTOR</title>
    <style>
        :root { --neon: #00ff41; --bg: #000a00; --red: #ff0000; --dim-neon: #004400; }
        
        body { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Consolas', monospace; 
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.15; z-index: 1; }

        #console { 
            border: 2px solid var(--dim-neon); padding: 30px; width: 85%; max-width: 400px;
            background: rgba(0, 10, 0, 0.9); box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative; z-index: 10; text-align: center;
        }

        .pin-container { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .pin-input {
            width: 35px; height: 50px; background: #000; border: 2px solid var(--neon);
            color: var(--neon); text-align: center; font-size: 22px; font-family: 'Consolas';
        }

        #loading-bar { display: none; width: 100%; height: 15px; border: 1px solid var(--neon); margin-top: 20px; }
        #progress { width: 0%; height: 100%; background: var(--neon); }

        #log { 
            display: none; text-align: left; font-size: 9px; margin-top: 15px; 
            max-height: 80px; overflow: hidden; color: #008822;
        }
        
        .glitch { animation: glitch 0.2s infinite; color: var(--red); }
        @keyframes glitch { 0% { transform: translate(2px,0); } 50% { transform: translate(-2px,1px); } 100% { transform: translate(0,-1px); } }
        
        button#start-btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px; cursor: pointer; }

        /* Pantalla de apagado */
        #shutdown {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; color: white; flex-direction: column;
            align-items: center; justify-content: center; font-size: 14px;
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div id="shutdown">
        <p>SISTEMA REINICIANDO...</p>
        <div style="width: 20px; height: 20px; border: 2px solid #fff; border-top: 2px solid #000; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>

    <div id="console">
        <div id="header" class="glitch">[ AMENAZA DETECTADA ]</div>
        <p id="instruction">INGRESE PIN DE DESINFECCIÓN:</p>

        <div class="pin-container" id="pin-box">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 0)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 1)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 2)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 3)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 4)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="validatePin()">
        </div>

        <div id="loading-bar"><div id="progress"></div></div>
        <div id="log"></div>
        <div id="status">ESPERANDO ACCIÓN...</div>

        <button id="start-btn" onclick="initAudio()">> INICIALIZAR DESINFECCIÓN</button>
    </div>

    <script>
        let audioCtx;
        const CORRECT_PIN = "070207";
        const urlParams = new URLSearchParams(window.location.search);
        const rawNombre = (urlParams.get('nombre') || "AGENTE");

        // Matrix
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01";
        const drops = Array(Math.floor(canvas.width/10)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 10, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            drops.forEach((y, i) => {
                ctx.fillText(letters[Math.floor(Math.random()*2)], i*10, y*10);
                if(y*10 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 35);

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            speak(rawNombre + ", el virus está extrayendo datos. Ingrese el código de emergencia.");
            document.getElementById('start-btn').style.display = 'none';
        }

        function speak(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'es-MX'; u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function moveNext(el, i) {
            if(el.value.length >= 1) {
                el.value = el.value.slice(0,1);
                const next = document.querySelectorAll('.pin-input')[i+1];
                if(next) next.focus();
            }
        }

        function validatePin() {
            const inputs = document.querySelectorAll('.pin-input');
            let pin = ""; inputs.forEach(i => pin += i.value);
            if(pin.length === 6) {
                if(pin === CORRECT_PIN) startCleaning();
                else {
                    speak("PIN incorrecto. El virus se está duplicando.");
                    inputs.forEach(i => i.value = ""); inputs[0].focus();
                }
            }
        }

        function startCleaning() {
            document.getElementById('pin-box').style.display = 'none';
            document.getElementById('header').classList.remove('glitch');
            document.getElementById('header').innerText = "[ ELIMINANDO MALWARE ]";
            document.getElementById('loading-bar').style.display = 'block';
            document.getElementById('log').style.display = 'block';
            
            const logs = [
                "Localizando troyano...", "Borrando caché infectada...", 
                "Restaurando kernel...", "Limpiando registro...",
                "Protegiendo archivos de " + rawNombre + "...", "Desinfección exitosa."
            ];

            let p = 0;
            let logIdx = 0;
            const interval = setInterval(() => {
                p += Math.random() * 8;
                if(p >= 100) {
                    p = 100; clearInterval(interval);
                    setTimeout(reboot, 1500);
                }
                document.getElementById('progress').style.width = p + "%";
                if(p > (logIdx * 20) && logs[logIdx]) {
                    document.getElementById('log').innerHTML += `> ${logs[logIdx]}<br>`;
                    logIdx++;
                }
            }, 150);
            
            speak("Código aceptado. Iniciando limpieza profunda del terminal.");
        }

        function reboot() {
            speak("Limpieza completada. Reiniciando terminal para aplicar cambios.");
            document.getElementById('shutdown').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('shutdown').innerHTML = "<p>DISPOSITIVO SEGURO</p><p style='font-size:10px'>PUEDES CERRAR ESTA VENTANA</p>";
            }, 3000);
        }
    </script>
    <style> @keyframes spin { to { transform: rotate(360deg); } } </style>
</body>
</html>
