<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROTOCOLO_DESINFECCION_V4</title>
    <style>
        :root { 
            --neon: #00ff41; 
            --bg: #050605; 
            --metal: #b0b0b0;
            --dark-metal: #222;
        }
        
        body { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Courier New', monospace; 
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* Overlay CRT mejorado */
        body::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none; z-index: 100;
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.1; z-index: 1; }

        /* Panel Industrial Ancho */
        #heavy-panel { 
            background: #333; 
            padding: 35px; 
            border: 6px solid #111;
            border-radius: 4px;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.9), inset 2px 2px 2px #666;
            z-index: 10;
            width: 90%;
            max-width: 450px; /* Más ancho */
            position: relative;
        }

        /* Detalles de hardware (tornillos) */
        .screw { position: absolute; width: 12px; height: 12px; background: #555; border-radius: 50%; border: 1px solid #111; box-shadow: inset 1px 1px 2px #000; }
        .s-tl { top: 10px; left: 10px; } .s-tr { top: 10px; right: 10px; }
        .s-bl { bottom: 10px; left: 10px; } .s-br { bottom: 10px; right: 10px; }

        #display-container {
            background: #020502;
            border: 4px solid #1a1a1a;
            margin-bottom: 25px;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 20px #000;
        }

        #pin-text {
            font-size: 38px; letter-spacing: 15px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 10px var(--neon);
        }

        .ventilation { width: 100%; height: 4px; background: #111; margin-bottom: 4px; opacity: 0.3; }

        .numpad { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 15px; background: #1a1a1a; padding: 20px; border: 2px solid #000;
        }

        .key {
            background: linear-gradient(145deg, #e6e6e6, #8a8a8a);
            border: 1px solid #444; border-radius: 3px;
            height: 65px; cursor: pointer;
            box-shadow: 5px 5px 0px #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 900; font-size: 22px; color: #111;
            transition: 0.03s;
        }

        .key span { font-size: 9px; margin-top: 4px; opacity: 0.7; }

        .key:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0px #000;
            background: #777;
        }

        /* Botones laterales */
        .f-key { font-size: 11px; background: #999; }
        .red-light { border-bottom: 6px solid #600; }
        .gold-light { border-bottom: 6px solid #660; }
        .green-light { border-bottom: 6px solid #060; }

        /* Glitch Pro */
        .glitch-active {
            animation: v-shake 0.1s infinite;
            filter: hue-rotate(90deg) contrast(1.5);
        }
        @keyframes v-shake {
            0% { clip-path: inset(10% 0 20% 0); transform: translateX(-5px); }
            50% { clip-path: inset(30% 0 5% 0); transform: translateX(5px); }
            100% { clip-path: inset(0); transform: translateX(0); }
        }

        #loader-box { display: none; background: #000; padding: 20px; border: 1px solid #004400; margin-top: 15px; }
        #progress-bg { width: 100%; height: 12px; background: #010; border: 1px solid var(--neon); overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--neon); box-shadow: 0 0 15px var(--neon); }

        #final-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 200; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body onpointerdown="bootSystem()">

    <canvas id="matrix-canvas"></canvas>

    <div id="final-overlay">
        <h1 style="letter-spacing: 5px; border: 2px solid var(--neon); padding: 20px;">DESINFECCIÓN EXITOSA</h1>
        <p id="user-confirm" style="margin-top: 20px;"></p>
        <div class="ventilation" style="width: 200px; opacity: 1;"></div>
    </div>

    <div id="heavy-panel">
        <div class="screw s-tl"></div><div class="screw s-tr"></div>
        <div class="screw s-bl"></div><div class="screw s-br"></div>

        <div style="font-size: 10px; font-weight: bold; margin-bottom: 10px; color: #888; display: flex; justify-content: space-between;">
            <span>SYSTEM_MODEL_2026</span>
            <span>STATUS: READY</span>
        </div>

        <div id="display-container">
            <div class="ventilation"></div>
            <div id="pin-text"></div>
        </div>
        
        <div id="pin-interface">
            <div class="numpad">
                <div class="key" onclick="press('1')">1 <span>QZ</span></div>
                <div class="key" onclick="press('2')">2 <span>ABC</span></div>
                <div class="key" onclick="press('3')">3 <span>DEF</span></div>
                <div class="key f-key green-light">ENTER</div>

                <div class="key" onclick="press('4')">4 <span>GHI</span></div>
                <div class="key" onclick="press('5')">5 <span>JKL</span></div>
                <div class="key" onclick="press('6')">6 <span>MNO</span></div>
                <div class="key f-key gold-light" onclick="clearAll()">CLEAR</div>

                <div class="key" onclick="press('7')">7 <span>PRS</span></div>
                <div class="key" onclick="press('8')">8 <span>TUV</span></div>
                <div class="key" onclick="press('9')">9 <span>WXY</span></div>
                <div class="key f-key red-light" onclick="clearAll()">CANCEL</div>

                <div class="key">.</div>
                <div class="key" onclick="press('0')">0</div>
                <div class="key">+</div>
                <div class="key" style="background:#444; border:none; box-shadow:none;"></div>
            </div>
        </div>

        <div id="loader-box">
            <div id="status-msg" style="font-size: 11px; margin-bottom: 8px;">INICIANDO LIMPIEZA...</div>
            <div id="progress-bg"><div id="progress-fill"></div></div>
            <div id="sub-log" style="font-size: 9px; color: #006600; margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        let audioCtx;
        let currentInput = "";
        const PASS = "070207";
        const params = new URLSearchParams(window.location.search);
        const name = (params.get('nombre') || "USUARIO").toUpperCase();
        let isBooted = false;

        function bootSystem() {
            if (isBooted) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Hum de fondo analógico
            const hum = audioCtx.createOscillator();
            const humGain = audioCtx.createGain();
            hum.type = 'triangle';
            hum.frequency.setValueAtTime(50, audioCtx.currentTime);
            humGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            hum.connect(humGain);
            humGain.connect(audioCtx.destination);
            hum.start();

            speak(`Sistema cargado. ${name}, ingrese código para desinfectar dispositivo.`);
            isBooted = true;
        }

        function playHeavyClick() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playFail() {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.4);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function speak(msg) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(msg);
            u.lang = 'es-MX'; u.rate = 0.85; u.pitch = 0.5;
            window.speechSynthesis.speak(u);
        }

        function press(n) {
            if (currentInput.length < 6) {
                currentInput += n;
                playHeavyClick();
                document.getElementById('pin-text').innerText = "*".repeat(currentInput.length);
                if (currentInput.length === 6) {
                    setTimeout(check, 400);
                }
            }
        }

        function clearAll() {
            currentInput = "";
            document.getElementById('pin-text').innerText = "";
            playHeavyClick();
        }

        function check() {
            if (currentInput === PASS) {
                runSanitization();
            } else {
                document.body.classList.add('glitch-active');
                playFail();
                speak("Código incorrecto.");
                setTimeout(() => {
                    document.body.classList.remove('glitch-active');
                    clearAll();
                }, 700);
            }
        }

        function runSanitization() {
            document.getElementById('pin-interface').style.display = 'none';
            document.getElementById('loader-box').style.display = 'block';
            let progress = 0;
            const log = document.getElementById('sub-log');
            const steps = [
                "EXTRACTING_MALWARE...", 
                "FLUSHING_CACHE...", 
                "REWRITING_SECTORS...", 
                "THERMAL_SYNC_COMPLETE."
            ];

            const timer = setInterval(() => {
                progress += 1;
                document.getElementById('progress-fill').style.width = progress + "%";
                
                if (progress % 25 === 0) {
                    log.innerHTML += "> " + steps[progress/25 - 1] + "<br>";
                    document.getElementById('status-msg').innerText = steps[progress/25 - 1];
                }

                if (progress >= 100) {
                    clearInterval(timer);
                    finish();
                }
            }, 60);
        }

        function finish() {
            const final = document.getElementById('final-overlay');
            final.style.display = 'flex';
            document.getElementById('user-confirm').innerText = "DISPOSITIVO DE " + name + " ESTÁ SEGURO.";
            speak("Desinfección concluida. El dispositivo de " + name + " es ahora seguro.");
        }

        // Matrix Background
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/18)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(5, 6, 5, 0.2)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#003300"; ctx.font = "14px monospace";
            drops.forEach((y, i) => {
                const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(text, i*18, y*18);
                if(y*18 > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 60);
    </script>
</body>
</html>
