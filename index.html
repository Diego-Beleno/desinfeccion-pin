<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_DECRYPTOR</title>
    <style>
        :root { --neon: #00ff41; --bg: #000a00; --red: #ff0000; --dim-neon: #004400; }
        
        body { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Consolas', monospace; 
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.15; z-index: 1; }

        #console { 
            border: 2px solid var(--dim-neon); padding: 30px; width: 85%; max-width: 400px;
            background: rgba(0, 10, 0, 0.9); box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative; z-index: 10; text-align: center;
        }

        .pin-container { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .pin-input {
            width: 35px; height: 50px; background: #000; border: 2px solid var(--neon);
            color: var(--neon); text-align: center; font-size: 22px; font-family: 'Consolas';
        }

        #loading-bar { 
            display: none; width: 100%; height: 15px; border: 1px solid var(--neon); 
            margin-top: 20px; position: relative; 
        }
        #progress { width: 0%; height: 100%; background: var(--neon); transition: width 0.1s; }

        .btn-final {
            display: none; background: var(--neon); color: #000; border: none;
            padding: 15px 25px; font-weight: bold; font-family: 'Consolas';
            cursor: pointer; margin-top: 20px; animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(0, 255, 65, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0); } }
        
        .glitch { animation: glitch 0.2s infinite; color: var(--red); }
        @keyframes glitch { 0% { transform: translate(2px,0); } 50% { transform: translate(-2px,1px); } 100% { transform: translate(0,-1px); } }
        
        button#start-btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div id="console">
        <div id="header" class="glitch">[ AMENAZA DETECTADA ]</div>
        <p id="instruction">INGRESE PIN DE DESINFECCIÓN:</p>

        <div class="pin-container" id="pin-box">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 0)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 1)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 2)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 3)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="moveNext(this, 4)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="validatePin()">
        </div>

        <div id="loading-bar"><div id="progress"></div></div>
        <div id="status">ESPERANDO ACCIÓN...</div>

        <button id="start-btn" onclick="initAudio()">> INICIALIZAR SISTEMA</button>
        <button class="btn-final" id="btn-reveal" onclick="window.location.href='TU_LINK_DE_UBICACION_AQUI'">VER COORDENADAS FINALES</button>
    </div>

    <script>
        let audioCtx;
        const CORRECT_PIN = "070207";
        const urlParams = new URLSearchParams(window.location.search);
        const rawNombre = (urlParams.get('nombre') || "AGENTE");

        // MATRIX EFFECT
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "0101010101010101";
        const fontSize = 10;
        const drops = Array(Math.floor(canvas.width/fontSize)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 10, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            for(let i=0; i<drops.length; i++){
                ctx.fillText(letters[Math.floor(Math.random()*letters.length)], i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            speak(rawNombre + ", el sistema ha sido infectado. Ingrese el PIN de seguridad.");
            document.getElementById('start-btn').style.display = 'none';
        }

        function speak(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'es-MX'; u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function moveNext(el, i) {
            if(el.value.length >= 1) {
                el.value = el.value.slice(0,1);
                const next = document.querySelectorAll('.pin-input')[i+1];
                if(next) next.focus();
            }
        }

        function validatePin() {
            const inputs = document.querySelectorAll('.pin-input');
            let pin = ""; inputs.forEach(i => pin += i.value);
            if(pin.length === 6) {
                if(pin === CORRECT_PIN) {
                    startExtraction();
                } else {
                    speak("Acceso denegado. Intente de nuevo.");
                    inputs.forEach(i => i.value = ""); inputs[0].focus();
                }
            }
        }

        function startExtraction() {
            document.getElementById('pin-box').style.display = 'none';
            document.getElementById('header').classList.remove('glitch');
            document.getElementById('header').innerText = "[ DESINFECCIÓN EN CURSO ]";
            document.getElementById('header').style.color = "var(--neon)";
            document.getElementById('loading-bar').style.display = 'block';
            
            let p = 0;
            const interval = setInterval(() => {
                p += Math.random() * 5;
                if(p >= 100) {
                    p = 100; clearInterval(interval);
                    finishSite();
                }
                document.getElementById('progress').style.width = p + "%";
                document.getElementById('status').innerText = "BORRANDO VIRUS: " + Math.floor(p) + "%";
            }, 100);
            
            speak("Eliminando amenazas... Reconstruyendo sectores de memoria.");
        }

        function finishSite() {
            document.getElementById('status').innerText = "SISTEMA LIMPIO. ACCESO CONCEDIDO.";
            document.getElementById('btn-reveal').style.display = 'inline-block';
            speak("Virus eliminado. Bienvenido, " + rawNombre + ". Presiona el botón para obtener las coordenadas.");
        }
    </script>
</body>
</html>
