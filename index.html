<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_DECRYPTOR</title>
    <style>
        :root { --neon: #00ff41; --bg: #000a00; --red: #ff0000; --dim-neon: #004400; }
        
        body { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Consolas', monospace; 
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.1s;
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.15; z-index: 1; }

        #console { 
            border: 2px solid var(--dim-neon); padding: 30px; width: 85%; max-width: 400px;
            background: rgba(0, 10, 0, 0.9); box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative; z-index: 10; text-align: center;
        }

        .pin-container { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .pin-input {
            width: 35px; height: 50px; background: #000; border: 2px solid var(--neon);
            color: var(--neon); text-align: center; font-size: 22px; font-family: 'Consolas';
        }

        #loading-bar { display: none; width: 100%; height: 15px; border: 1px solid var(--neon); margin-top: 20px; }
        #progress { width: 0%; height: 100%; background: var(--neon); }

        #log { display: none; text-align: left; font-size: 9px; margin-top: 15px; max-height: 80px; overflow: hidden; color: #008822; }
        
        .error-glitch { animation: shake 0.1s infinite; background: var(--red) !important; color: white !important; }
        @keyframes shake { 0% { transform: translate(5px, 5px); } 20% { transform: translate(-5px, 0); } 40% { transform: translate(5px, -5px); } 100% { transform: translate(0,0); } }
        
        #shutdown {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; color: white; flex-direction: column;
            align-items: center; justify-content: center; font-size: 14px;
        }
        
        .hint { font-size: 8px; opacity: 0.5; margin-top: 10px; }
    </style>
</head>
<body onclick="initAudio()">
    <canvas id="matrix-canvas"></canvas>

    <div id="shutdown">
        <p>SISTEMA REINICIANDO...</p>
        <div style="width: 20px; height: 20px; border: 2px solid #fff; border-top: 2px solid #000; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>

    <div id="console">
        <div id="header" style="font-weight: bold;">[ AMENAZA DETECTADA ]</div>
        <p id="instruction">INGRESE PIN Y PRESIONE ENTER:</p>

        <div class="pin-container" id="pin-box">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 0)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 1)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 2)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 3)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 4)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 5)" onkeydown="checkEnter(event)">
        </div>

        <div id="loading-bar"><div id="progress"></div></div>
        <div id="log"></div>
        <div id="status">ESPERANDO CÓDIGO...</div>
        <div class="hint">TOQUE LA PANTALLA PARA ACTIVAR AUDIO</div>
    </div>

    <script>
        let audioCtx;
        const CORRECT_PIN = "070207";
        const urlParams = new URLSearchParams(window.location.search);
        const rawNombre = (urlParams.get('nombre') || "USUARIO");
        let voiceStarted = false;

        // Matrix Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/10)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 10, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            drops.forEach((y, i) => {
                ctx.fillText(Math.floor(Math.random()*2), i*10, y*10);
                if(y*10 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 35);

        function initAudio() {
            if (voiceStarted) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            speak(rawNombre + ", el virus está extrayendo datos. Ingrese el código de emergencia y presione enter.");
            voiceStarted = true;
            document.querySelector('.hint').style.display = 'none';
        }

        function playBeep(f) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.frequency.value = f;
            g.gain.value = 0.1;
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function speak(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'es-MX'; u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function handleInput(el, i) {
            if(el.value.length >= 1) {
                el.value = el.value.slice(0,1);
                playBeep(600);
                const next = document.querySelectorAll('.pin-input')[i+1];
                if(next) next.focus();
            }
        }

        function checkEnter(e) {
            if(e.key === "Enter") validatePin();
        }

        function validatePin() {
            const inputs = document.querySelectorAll('.pin-input');
            let pin = ""; inputs.forEach(i => pin += i.value);
            
            if(pin === CORRECT_PIN) {
                startCleaning();
            } else {
                triggerError();
            }
        }

        function triggerError() {
            document.body.classList.add('error-glitch');
            playBeep(100);
            speak("Error de autenticación. Amenaza incrementada.");
            
            setTimeout(() => {
                document.body.classList.remove('error-glitch');
                const inputs = document.querySelectorAll('.pin-input');
                inputs.forEach(i => i.value = "");
                inputs[0].focus();
            }, 500);
        }

        function startCleaning() {
            document.getElementById('pin-box').style.display = 'none';
            document.getElementById('header').innerText = "[ ELIMINANDO MALWARE ]";
            document.getElementById('loading-bar').style.display = 'block';
            document.getElementById('log').style.display = 'block';
            
            const logs = ["Caché infectada...", "Kernel restaurado...", "Registro limpio...", "Acceso seguro."];
            let p = 0, logIdx = 0;
            
            const interval = setInterval(() => {
                p += 5;
                if(p >= 100) {
                    clearInterval(interval);
                    setTimeout(reboot, 1000);
                }
                document.getElementById('progress').style.width = p + "%";
                if(p % 25 === 0 && logs[logIdx]) {
                    document.getElementById('log').innerHTML += `> ${logs[logIdx]}<br>`;
                    logIdx++;
                }
            }, 100);
            speak("Código aceptado. Ejecutando purga del sistema.");
        }

        function reboot() {
            document.getElementById('shutdown').style.display = 'flex';
            speak("Sistema limpio. Reiniciando.");
            setTimeout(() => {
                document.getElementById('shutdown').innerHTML = "<p>DISPOSITIVO SEGURO</p><p style='font-size:10px'>TU ACCESO HA SIDO RESTABLECIDO</p>";
            }, 3000);
        }
    </script>
</body>
</html>
