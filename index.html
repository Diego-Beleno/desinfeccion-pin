<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROOT_DECRYPT_PROTOCOL</title>
    <style>
        :root { --neon: #00ff41; --bg: #000a00; --red: #ff0000; --dim-neon: #004400; }
        
        body { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Consolas', monospace; 
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; 
            align-items: flex-start; /* Consola arriba */
            justify-content: center;
            padding-top: 10vh; /* Espacio para que el teclado no tape el PIN */
        }

        body::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.12; z-index: 1; }

        #console { 
            border: 1px solid var(--dim-neon); padding: 25px; 
            width: 80%; /* Más estrecho */
            max-width: 340px; /* Tamaño reducido */
            background: rgba(0, 5, 0, 0.95); box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
            position: relative; z-index: 10; text-align: center;
            transition: all 0.3s ease;
        }

        .pin-container { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .pin-input {
            width: 32px; height: 48px; background: transparent; border: 1px solid var(--neon);
            color: var(--neon); text-align: center; font-size: 20px; font-family: 'Consolas';
            text-shadow: 0 0 5px var(--neon);
        }

        #loading-wrapper { display: none; margin-top: 25px; text-align: left; }
        .tech-data { font-size: 9px; color: #008822; margin-bottom: 5px; height: 12px; }
        #loading-bar { width: 100%; height: 8px; border: 1px solid var(--dim-neon); position: relative; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: var(--neon); box-shadow: 0 0 10px var(--neon); }

        #log { font-size: 8px; color: #006600; margin-top: 15px; height: 80px; overflow: hidden; line-height: 1.4; border-top: 1px solid #002200; padding-top: 10px; }

        /* Efectos de retroalimentación */
        .critical-glitch { animation: flash-red 0.1s infinite, noise 0.2s infinite; }
        .success-flash { animation: flash-green 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes flash-red { 0% { background: rgba(255, 0, 0, 0.4); } 100% { background: transparent; } }
        @keyframes flash-green { 0% { background: rgba(0, 255, 65, 0.6); } 100% { background: transparent; } }
        @keyframes noise { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-3px, -1px); filter: hue-rotate(90deg); } 100% { transform: translate(1px, -2px); } }

        #shutdown {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; color: #fff; flex-direction: column;
            align-items: center; justify-content: center; font-family: 'Courier New', monospace;
        }

        .hint { font-size: 8px; opacity: 0.4; margin-top: 15px; letter-spacing: 2px; }
    </style>
</head>
<body onclick="initAudio()">
    <canvas id="matrix-canvas"></canvas>

    <div id="shutdown">
        <p id="shutdown-text">REBOOTING SYSTEM...</p>
        <div style="width: 40px; height: 2px; background: #333; overflow: hidden;">
            <div style="width: 100%; height: 100%; background: #fff; animation: loading 2s infinite;"></div>
        </div>
    </div>

    <div id="console">
        <div id="header" style="letter-spacing: 3px; font-size: 14px;">[ ENCRYPTION_LOCK ]</div>
        <div id="instruction" style="font-size: 9px; margin-top: 8px; opacity: 0.8;">OVERRIDE_SEQUENCE_REQUIRED</div>

        <div class="pin-container" id="pin-box">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 0)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 1)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 2)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 3)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 4)">
            <input type="number" class="pin-input" pattern="\d*" inputmode="numeric" oninput="handleInput(this, 5)">
        </div>

        <div id="loading-wrapper">
            <div class="tech-data" id="sector-info">ANALYZING SECTOR: 0x0000</div>
            <div id="loading-bar"><div id="progress"></div></div>
            <div id="log"></div>
        </div>

        <div id="status" style="font-size: 9px; margin-top: 15px;">WAITING_FOR_INPUT...</div>
        <div class="hint">STATUS: PROTECTED - TAP TO START</div>
    </div>

    <script>
        let audioCtx;
        const CORRECT_PIN = "070207";
        const urlParams = new URLSearchParams(window.location.search);
        const rawNombre = (urlParams.get('nombre') || "USER_INV").toUpperCase();
        let voiceStarted = false;

        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/12)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 10, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = "10px monospace";
            drops.forEach((y, i) => {
                const text = Math.random() > 0.5 ? "0" : "1";
                ctx.fillText(text, i*12, y*12);
                if(y*12 > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 50);

        function initAudio() {
            if (voiceStarted) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            speak(`Acceso restringido para ${rawNombre}. Ingrese el código raíz.`);
            voiceStarted = true;
            document.querySelector('.hint').style.display = 'none';
        }

        function playSound(freq, type, dur, vol = 0.1) {
            if(!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.value = vol;
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + dur);
        }

        function speak(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'es-MX'; u.rate = 1.1; u.pitch = 0.8;
            window.speechSynthesis.speak(u);
        }

        function handleInput(el, i) {
            if(el.value.length >= 1) {
                el.value = el.value.slice(0,1);
                playSound(800, 'square', 0.05);
                const inputs = document.querySelectorAll('.pin-input');
                if(inputs[i+1]) inputs[i+1].focus();
                if(i === 5) validatePin();
            }
        }

        function validatePin() {
            const inputs = document.querySelectorAll('.pin-input');
            let pin = ""; inputs.forEach(inp => pin += inp.value);
            
            if(pin === CORRECT_PIN) {
                // Efecto de Éxito
                document.body.classList.add('success-flash');
                playSound(600, 'sine', 0.1, 0.2);
                setTimeout(() => playSound(900, 'sine', 0.2, 0.2), 100);
                startDeepScan();
            } else {
                triggerGlitch();
            }
        }

        function triggerGlitch() {
            document.body.classList.add('critical-glitch');
            playSound(100, 'sawtooth', 0.4);
            speak("Acceso denegado.");
            setTimeout(() => {
                document.body.classList.remove('critical-glitch');
                const inputs = document.querySelectorAll('.pin-input');
                inputs.forEach(inp => inp.value = "");
                inputs[0].focus();
            }, 800);
        }

        function startDeepScan() {
            document.getElementById('pin-box').style.display = 'none';
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('header').innerText = "[ PURGE_IN_PROGRESS ]";
            document.getElementById('loading-wrapper').style.display = 'block';
            
            const logs = [
                "> ANALYZING MEMORY BLOCKS...",
                "> TARGET: VIRUS_CORE_X26",
                "> WIPING CACHE SECTORS...",
                "> REBUILDING FILE_SYSTEM...",
                "> FLUSHING KERNEL_LOGS...",
                "> SYSTEM_INTEGRITY: 100%",
                "> ACCESS_GRANTED: " + rawNombre
            ];

            let p = 0; let logIdx = 0;
            const interval = setInterval(() => {
                p += Math.random() * 1.2; // Más lento y detallado
                if(p >= 100) {
                    p = 100;
                    clearInterval(interval);
                    setTimeout(finalize, 1500);
                }
                document.getElementById('progress').style.width = p + "%";
                document.getElementById('sector-info').innerText = `SCANNING: 0x${Math.floor(p*482).toString(16).toUpperCase()}`;
                
                if(p > (logIdx * 14) && logs[logIdx]) {
                    const logLine = document.createElement('div');
                    logLine.innerText = logs[logIdx];
                    document.getElementById('log').appendChild(logLine);
                    logIdx++;
                    playSound(1200, 'sine', 0.02, 0.05);
                }
            }, 150);
            speak("PIN aceptado. Iniciando purga total.");
        }

        function finalize() {
            document.getElementById('shutdown').style.display = 'flex';
            speak("Purga completada. Bienvenido, " + rawNombre);
            setTimeout(() => {
                document.getElementById('shutdown-text').innerHTML = "SYSTEM_CLEAN<br>USER_VERIFIED: " + rawNombre;
                document.getElementById('shutdown').style.color = "var(--neon)";
            }, 3000);
        }
    </script>
    <style> @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } } </style>
</body>
</html>
