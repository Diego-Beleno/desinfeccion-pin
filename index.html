<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROOT_DECRYPT_PROTOCOL</title>
    <style>
        :root { --neon: #00ff41; --bg: #000a00; --red: #ff0000; --dim-neon: #004400; }
        
        body { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Consolas', monospace; 
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 5vh;
        }

        body::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.12; z-index: 1; }

        #console { 
            border: 1px solid var(--dim-neon); padding: 15px; width: 85%; max-width: 320px;
            background: rgba(0, 5, 0, 0.95); box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            position: relative; z-index: 10; text-align: center;
        }

        /* Pantalla de visualización del PIN */
        #pin-display {
            background: rgba(0, 20, 0, 0.5); border: 1px solid var(--dim-neon);
            margin: 10px 0; padding: 10px; font-size: 24px; letter-spacing: 10px;
            height: 30px; display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 10px var(--neon);
        }

        /* Teclado Táctil Estilo Terminal */
        .numpad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin-top: 15px; padding: 10px;
        }

        .num-btn {
            background: transparent; border: 1px solid var(--neon);
            color: var(--neon); padding: 15px; font-size: 18px; font-family: 'Consolas';
            cursor: pointer; transition: all 0.1s;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .num-btn:active { background: var(--neon); color: var(--bg); box-shadow: 0 0 15px var(--neon); }

        .btn-clear { border-color: var(--red); color: var(--red); }
        .btn-clear:active { background: var(--red); color: white; box-shadow: 0 0 15px var(--red); }

        /* Barra de carga y logs */
        #loading-wrapper { display: none; margin-top: 15px; text-align: left; }
        .tech-data { font-size: 9px; color: #008822; margin-bottom: 5px; }
        #loading-bar { width: 100%; height: 6px; border: 1px solid var(--dim-neon); position: relative; }
        #progress { width: 0%; height: 100%; background: var(--neon); box-shadow: 0 0 8px var(--neon); }
        #log { font-size: 8px; color: #006600; margin-top: 10px; height: 70px; overflow: hidden; border-top: 1px solid #002200; padding-top: 5px; }

        /* Animaciones */
        .critical-glitch { animation: flash-red 0.1s infinite; }
        .success-flash { animation: flash-green 0.5s ease-out; }
        @keyframes flash-red { 0% { background: rgba(255, 0, 0, 0.3); } 100% { background: transparent; } }
        @keyframes flash-green { 0% { background: rgba(0, 255, 65, 0.4); } 100% { background: transparent; } }

        #shutdown {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; color: #fff; flex-direction: column;
            align-items: center; justify-content: center; font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body onclick="initAudio()">
    <canvas id="matrix-canvas"></canvas>

    <div id="shutdown">
        <p id="shutdown-text">REBOOTING SYSTEM...</p>
        <div style="width: 40px; height: 2px; background: #333; overflow: hidden;">
            <div style="width: 100%; height: 100%; background: #fff; animation: loading 2s infinite;"></div>
        </div>
    </div>

    <div id="console">
        <div id="header" style="letter-spacing: 2px; font-size: 14px;">[ ACCESS_CONTROL_v3.0 ]</div>
        
        <div id="pin-ui">
            <div id="pin-display"></div>
            <div class="numpad">
                <button class="num-btn" onclick="pressNum('1')">1</button>
                <button class="num-btn" onclick="pressNum('2')">2</button>
                <button class="num-btn" onclick="pressNum('3')">3</button>
                <button class="num-btn" onclick="pressNum('4')">4</button>
                <button class="num-btn" onclick="pressNum('5')">5</button>
                <button class="num-btn" onclick="pressNum('6')">6</button>
                <button class="num-btn" onclick="pressNum('7')">7</button>
                <button class="num-btn" onclick="pressNum('8')">8</button>
                <button class="num-btn" onclick="pressNum('9')">9</button>
                <button class="num-btn btn-clear" onclick="clearPin()">C</button>
                <button class="num-btn" onclick="pressNum('0')">0</button>
                <button class="num-btn" style="border-color: var(--dim-neon); opacity: 0.5;">#</button>
            </div>
        </div>

        <div id="loading-wrapper">
            <div class="tech-data" id="sector-info">PREPARING PURGE...</div>
            <div id="loading-bar"><div id="progress"></div></div>
            <div id="log"></div>
        </div>

        <div id="status" style="font-size: 9px; margin-top: 10px; opacity: 0.6;">INPUT_REQUIRED</div>
    </div>

    <script>
        let audioCtx;
        const CORRECT_PIN = "070207";
        let currentPin = "";
        const urlParams = new URLSearchParams(window.location.search);
        const rawNombre = (urlParams.get('nombre') || "USER_INV").toUpperCase();
        let voiceStarted = false;

        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/12)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 10, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = "10px monospace";
            drops.forEach((y, i) => {
                ctx.fillText(Math.random() > 0.5 ? "0" : "1", i*12, y*12);
                if(y*12 > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 50);

        function initAudio() {
            if (voiceStarted) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            speak(`Terminal de control activa. Identidad detectada: ${rawNombre}. Ingrese código.`);
            voiceStarted = true;
        }

        function playSound(freq, type, dur, vol = 0.1) {
            if(!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.value = vol;
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + dur);
        }

        function speak(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'es-MX'; u.rate = 1.1; u.pitch = 0.8;
            window.speechSynthesis.speak(u);
        }

        function pressNum(num) {
            if(currentPin.length < 6) {
                currentPin += num;
                updateDisplay();
                playSound(800, 'sine', 0.05);
                if(currentPin.length === 6) validatePin();
            }
        }

        function clearPin() {
            currentPin = "";
            updateDisplay();
            playSound(200, 'square', 0.1);
        }

        function updateDisplay() {
            const display = document.getElementById('pin-display');
            display.innerText = "*".repeat(currentPin.length);
        }

        function validatePin() {
            if(currentPin === CORRECT_PIN) {
                document.body.classList.add('success-flash');
                playSound(600, 'sine', 0.1, 0.2);
                setTimeout(() => playSound(900, 'sine', 0.2, 0.2), 100);
                startDeepScan();
            } else {
                triggerGlitch();
            }
        }

        function triggerGlitch() {
            document.body.classList.add('critical-glitch');
            playSound(100, 'sawtooth', 0.4);
            speak("Código incorrecto.");
            setTimeout(() => {
                document.body.classList.remove('critical-glitch');
                clearPin();
            }, 800);
        }

        function startDeepScan() {
            document.getElementById('pin-ui').style.display = 'none';
            document.getElementById('header').innerText = "[ EXECUTING_PURGE ]";
            document.getElementById('loading-wrapper').style.display = 'block';
            
            const logs = [
                "> INITIALIZING CLEANUP...",
                "> DELETING TEMP_CACHE...",
                "> OVERWRITING REGISTRY...",
                "> PURGING LOG_FILES...",
                "> OPTIMIZING KERNEL...",
                "> SECURITY_CHECK: OK",
                "> ACCESS_GRANTED: " + rawNombre
            ];

            let p = 0; let logIdx = 0;
            const interval = setInterval(() => {
                p += Math.random() * 1.5;
                if(p >= 100) {
                    p = 100; clearInterval(interval);
                    setTimeout(finalize, 1500);
                }
                document.getElementById('progress').style.width = p + "%";
                document.getElementById('sector-info').innerText = `PURGING_SECTOR: 0x${Math.floor(p*512).toString(16).toUpperCase()}`;
                
                if(p > (logIdx * 14) && logs[logIdx]) {
                    const logLine = document.createElement('div');
                    logLine.innerText = logs[logIdx];
                    document.getElementById('log').appendChild(logLine);
                    logIdx++;
                    playSound(1000, 'sine', 0.02, 0.05);
                }
            }, 100);
            speak("Acceso concedido. Limpiando sistema.");
        }

        function finalize() {
            document.getElementById('shutdown').style.display = 'flex';
            speak("Limpieza finalizada. Bienvenido, " + rawNombre);
            setTimeout(() => {
                document.getElementById('shutdown-text').innerHTML = "SYSTEM_OPTIMIZED<br>AGENT: " + rawNombre;
                document.getElementById('shutdown').style.color = "var(--neon)";
            }, 3000);
        }
    </script>
    <style> @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } } </style>
</body>
</html>
